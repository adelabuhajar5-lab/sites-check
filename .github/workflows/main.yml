name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project and add our code
        run: |
          flutter create --platforms=android --org com.sitescheck --project-name sites_check build_app
          rm -rf build_app/lib build_app/test
          mkdir build_app/lib
          cp *.dart build_app/lib/
          cp pubspec.yaml build_app/pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="Sites Check"/' build_app/android/app/src/main/AndroidManifest.xml

      - name: Let plugins compile against Android 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android') && p.name != 'app') {
                p.android.compileSdkVersion 36
              }
            }
          }
          EOF

      - name: Build release APK
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: SitesCheck-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
